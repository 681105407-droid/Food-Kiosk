<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Food Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* =========================================
       PURE CSS - สไตล์ตู้ Kiosk 
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
      color: #333;
      overflow: hidden;
    }

    #loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-size: 24px;
      font-weight: bold;
      color: #ff6b6b;
    }

    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #ff6b6b;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .menu-section {
      flex: 7;
      display: flex;
      flex-direction: column;
      padding: 20px;
      height: 100%;
    }

    .header {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2c3e50;
      border-bottom: 3px solid #ff6b6b;
      padding-bottom: 10px;
      display: inline-block;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    .menu-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .menu-card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .menu-image {
      width: 100%;
      height: 160px;
      background-color: #e9ecef;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #adb5bd;
      font-size: 14px;
    }

    .menu-info {
      padding: 15px;
      text-align: center;
    }

    .menu-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
    .menu-price { font-size: 20px; font-weight: bold; color: #ff6b6b; }

    .add-btn {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-section {
      flex: 3;
      background: white;
      border-left: 2px solid #e9ecef;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 15px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .cart-header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    .cart-items { flex: 1; overflow-y: auto; padding: 15px; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #e9ecef;
    }

    .item-details { flex: 1; }
    .item-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
    .item-price { color: #ff6b6b; font-weight: bold; }

    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      background: white; border: 2px solid #dee2e6; border-radius: 50%;
      width: 36px; height: 36px; font-size: 20px; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #495057;
    }
    .qty-btn:active { background: #e9ecef; }

    .cart-footer { padding: 20px; background: #f8f9fa; border-top: 2px solid #e9ecef; }
    .total-row {
      display: flex; justify-content: space-between;
      font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #2c3e50;
    }

    .checkout-btn {
      width: 100%; background: #27ae60; color: white; border: none;
      padding: 20px; border-radius: 12px; font-size: 24px; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    .checkout-btn:active { background: #219653; }
    .checkout-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">กำลังโหลดเมนูอาหาร...</div>
  </div>

  <div class="menu-section">
    <div class="header">เมนูอาหาร (Food Menu)</div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <div class="cart-section">
    <div class="cart-header">🛒 รายการสั่งซื้อ</div>
    <div class="cart-items" id="cart-items"></div>
    
    <div class="cart-footer">
      <div class="total-row">
        <span>รวมทั้งสิ้น:</span>
        <span id="total-price">฿0</span>
      </div>
      <button class="checkout-btn" id="checkout-btn" onclick="checkout()" disabled>ยืนยันคำสั่งซื้อ</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ นำ URL จาก Google Apps Script (Web App) มาวางที่นี่
    // ==========================================
    const SCRIPT_URL = 'YOUR_URL'; 

    let menuData = [];
    let cart = [];

    window.onload = function() {
      // ใช้ fetch ยิงไปหา Apps Script แบบ GET
      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => renderMenu(data))
        .catch(error => showError(error));
    };

    function renderMenu(data) {
      menuData = data;
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      if(data.length === 0) {
        grid.innerHTML = '<h2>ไม่พบรายการอาหาร กรุณาตรวจสอบ Google Sheet</h2>';
      }

      data.forEach(item => {
        let imageHTML = item.imageUrl 
          ? `<img src="${item.imageUrl}" class="menu-image" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` 
          : '';
        let placeholderHTML = `<div class="menu-image" style="display: ${item.imageUrl ? 'none' : 'flex'}">ไม่มีรูปภาพ</div>`;

        const card = document.createElement('div');
        card.className = 'menu-card';
        card.onclick = () => addToCart(item.id);
        
        card.innerHTML = `
          ${imageHTML}
          ${placeholderHTML}
          <div class="menu-info">
            <div class="menu-name">${item.name}</div>
            <div class="menu-price">฿${item.price}</div>
          </div>
          <button class="add-btn">เลือก</button>
        `;
        grid.appendChild(card);
      });

      document.getElementById('loader').style.display = 'none';
    }

    function showError(error) {
      document.getElementById('loader-text').innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล (CORS / Network Error)';
      console.error(error);
    }

    function addToCart(id) {
      const product = menuData.find(item => item.id === id);
      const cartItem = cart.find(item => item.id === id);

      if (cartItem) cartItem.quantity++;
      else cart.push({ ...product, quantity: 1 });
      
      updateCartUI();
    }

    function changeQuantity(id, delta) {
      const index = cart.findIndex(item => item.id === id);
      if (index !== -1) {
        cart[index].quantity += delta;
        if (cart[index].quantity <= 0) cart.splice(index, 1);
        updateCartUI();
      }
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cart-items');
      const checkoutBtn = document.getElementById('checkout-btn');
      cartContainer.innerHTML = '';

      let total = 0;

      if (cart.length === 0) {
        cartContainer.innerHTML = '<div style="text-align:center; margin-top:50px; color:#adb5bd;">ยังไม่มีรายการสั่งซื้อ</div>';
        checkoutBtn.disabled = true;
      } else {
        checkoutBtn.disabled = false;
        
        cart.forEach(item => {
          total += item.price * item.quantity;
          const itemDiv = document.createElement('div');
          itemDiv.className = 'cart-item';
          itemDiv.innerHTML = `
            <div class="item-details">
              <div class="item-name">${item.name}</div>
              <div class="item-price">฿${item.price * item.quantity}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQuantity('${item.id}', -1)">-</button>
              <span style="font-size: 18px; font-weight: bold; width: 20px; text-align: center;">${item.quantity}</span>
              <button class="qty-btn" onclick="changeQuantity('${item.id}', 1)">+</button>
            </div>
          `;
          cartContainer.appendChild(itemDiv);
        });
      }

      document.getElementById('total-price').innerText = `฿${total}`;
    }

    function checkout() {
      if (cart.length === 0) return;

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      document.getElementById('loader-text').innerText = 'กำลังส่งคำสั่งซื้อ...';
      document.getElementById('loader').style.display = 'flex';

      const payload = {
        action: 'placeOrder',
        cart: cart,
        totalPrice: total
      };

      // ยิงข้อมูลสั่งซื้อไปยัง Apps Script ด้วยวิธี POST
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
        // ข้อควรระวัง: ห้ามใส่ Content-Type: application/json เพราะจะทำให้ติดปัญหา CORS Preflight ใน GAS
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loader').style.display = 'none';
        if(data.success) {
          alert('สั่งอาหารสำเร็จ! หมายเลขคิวของคุณคือ: ' + data.orderId);
          cart = [];
          updateCartUI();
        } else {
          alert('เกิดข้อผิดพลาด: ' + data.message);
        }
      })
      .catch(error => showError(error));
    }
  </script>
</body>
</html>
